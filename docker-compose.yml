version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: campushire-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password_campushire_2026
      MYSQL_DATABASE: campushire
      MYSQL_USER: campushire_user
      MYSQL_PASSWORD: campushire_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
      - ./database/views.sql:/docker-entrypoint-initdb.d/03_views.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password_campushire_2026"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - campushire-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campushire-backend
    restart: unless-stopped
    environment:
      PORT: 4000
      NODE_ENV: production
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: campushire_user
      DB_PASSWORD: campushire_password
      DB_NAME: campushire
      JWT_SECRET: super_secret_jwt_key_campushire_production_2026
      JWT_EXPIRES_IN: 7d
      CLIENT_ORIGIN: "http://localhost:5173"
    ports:
      - "4000:4000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - campushire-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: campushire-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - campushire-network

volumes:
  mysql_data:
    driver: local

networks:
  campushire-network:
    driver: bridge
